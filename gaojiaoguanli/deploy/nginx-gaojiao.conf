# ============================================================
# Nginx 反向代理配置 — 稿件管理系统集群
# 部署位置：/etc/nginx/conf.d/gaojiao.conf
# ============================================================

# 上游 Tomcat 集群（ip_hash 保持会话粘性）
# AuthorizationInterceptor 将 userId/role/tableName 存入 HttpSession
# 失去会话粘性会导致用户需要重新登录
upstream gaojiao_backend {
    ip_hash;  # 基于客户端 IP 的会话粘性

    # Tomcat 节点列表（按实际集群规模增减）
    server 192.168.1.101:8080 weight=1 max_fails=3 fail_timeout=30s;
    server 192.168.1.102:8080 weight=1 max_fails=3 fail_timeout=30s;
    # server 192.168.1.103:8080 weight=1 max_fails=3 fail_timeout=30s;

    keepalive 32;  # 长连接池
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name gaojiao.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name gaojiao.example.com;

    # --- SSL 证书 ---
    ssl_certificate     /etc/nginx/ssl/gaojiao.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/gaojiao.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- 上传大小限制 ---
    # Spring CommonsMultipartResolver 限制 ~31MB，这里留余量
    client_max_body_size 40m;

    # --- 安全头 ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- 反向代理 ---
    location /gaojiaoguanli/ {
        proxy_pass http://gaojiao_backend/gaojiaoguanli/;

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（审稿流程可能较慢）
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }

    # --- 静态资源缓存 ---
    location /gaojiaoguanli/resources/ {
        proxy_pass http://gaojiao_backend/gaojiaoguanli/resources/;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- 健康检查（仅内网访问） ---
    location /gaojiaoguanli/health {
        proxy_pass http://gaojiao_backend/gaojiaoguanli/health;
        access_log off;
        allow 192.168.0.0/16;
        deny all;
    }

    # 访问日志
    access_log /var/log/nginx/gaojiao_access.log;
    error_log  /var/log/nginx/gaojiao_error.log;
}
