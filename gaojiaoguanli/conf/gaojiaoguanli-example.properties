# ==============================================================
# 学报管理系统 - 生产环境配置模板
# 复制本文件到 ${CATALINA_BASE}/conf/gaojiaoguanli.properties
# 此文件中的值会覆盖 WAR 内 config.properties 的默认值
# ==============================================================

# --- 数据库连接 ---
jdbc_url=jdbc:mysql://db-prod:3306/gaojiaoguanli?useUnicode=true&characterEncoding=UTF-8&useSSL=true&tinyInt1isBit=false
jdbc_username=gaojiaoguanli_app
jdbc_password=CHANGE_ME

# --- 文件上传根目录（绝对路径，确保 Tomcat 用户有读写权限） ---
upload.base-dir=/data/gaojiaoguanli/upload
